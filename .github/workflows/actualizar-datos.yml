name: Actualizar personajes

on:
  schedule:
    - cron: '0 5 * * 1' # todos los lunes a las 05:00 UTC
  workflow_dispatch: # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: write

concurrency: actualizar-datos

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Si el script falla no toca /data y el workflow se para aquí:
      # se conservan los archivos anteriores.
      - name: Generar datos desde AniList
        run: node scripts/actualizar-datos.mjs

      - name: Subir cambios
        run: |
          git config user.name "peter1323"
          git config user.email "101800724+peter1323@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios en los personajes."
            exit 0
          fi
          git commit -m "Actualizar personajes"
          git push
